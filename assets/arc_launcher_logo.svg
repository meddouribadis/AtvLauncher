<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="mesh-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <clipPath id="app-icon">
      <rect x="0" y="0" width="200" height="200" rx="45" />
    </clipPath>
  </defs>

  <!-- The Icon -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="200" height="200" rx="45" fill="#0A0A0A" />
    <g clip-path="url(#app-icon)">
      <circle cx="40" cy="40" r="120" fill="#EC4899" filter="url(#mesh-blur)" opacity="0.85" />
      <circle cx="160" cy="160" r="140" fill="#4F46E5" filter="url(#mesh-blur)" opacity="0.95" />
      <circle cx="40" cy="160" r="100" fill="#06B6D4" filter="url(#mesh-blur)" opacity="0.85" />
      <path d="M -30 140 Q 100 10 230 140" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    </g>
    <rect x="0" y="0" width="200" height="200" rx="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
    <rect x="1" y="1" width="198" height="198" rx="44" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- The Typography (Apple Style) -->
  <text x="265" y="146" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.5">
    <tspan fill="#FFFFFF">Arc </tspan>
    <tspan font-weight="400" fill="#A1A1AA">Launcher</tspan>
  </text>
</svg>
