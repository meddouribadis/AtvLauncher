<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arc Launcher - Final Logo</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background-color 0.4s ease, color 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body.dark {
      background-color: #000000;
      color: #FFFFFF;
    }

    body.light {
      background-color: #F5F5F7; /* Apple's signature light gray */
      color: #1D1D1F; /* Apple's dark text color */
    }

    .logo-container {
      width: 100%;
      max-width: 800px;
      padding: 40px;
    }

    .logo-container svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3));
    }

    body.light .logo-container svg {
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1));
    }

    /* Target the text inside SVG depending on theme to show it works beautifully in light mode too */
    body.light .logo-text-arc {
      fill: #1D1D1F !important;
    }
    body.light .logo-text-launcher {
      fill: #86868B !important;
    }

    .controls {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 20px;
    }

    button {
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(128,128,128,0.3);
      background: rgba(128,128,128,0.1);
      color: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(128,128,128,0.2);
    }
  </style>
</head>
<body class="dark">

  <div class="logo-container">
    <svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
      <defs>
        <filter id="mesh-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="24" />
        </filter>
        <clipPath id="app-icon">
          <rect x="0" y="0" width="200" height="200" rx="45" />
        </clipPath>
      </defs>

      <g transform="translate(25, 25)">
        <rect x="0" y="0" width="200" height="200" rx="45" fill="#0A0A0A" />
        <g clip-path="url(#app-icon)">
          <circle cx="40" cy="40" r="120" fill="#EC4899" filter="url(#mesh-blur)" opacity="0.85" />
          <circle cx="160" cy="160" r="140" fill="#4F46E5" filter="url(#mesh-blur)" opacity="0.95" />
          <circle cx="40" cy="160" r="100" fill="#06B6D4" filter="url(#mesh-blur)" opacity="0.85" />
          <path d="M -30 140 Q 100 10 230 140" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
        </g>
        <rect x="0" y="0" width="200" height="200" rx="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
        <rect x="1" y="1" width="198" height="198" rx="44" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="1" />
      </g>

      <text x="265" y="146" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.5">
        <tspan class="logo-text-arc" fill="#FFFFFF">Arc </tspan>
        <tspan class="logo-text-launcher" font-weight="400" fill="#A1A1AA">Launcher</tspan>
      </text>
    </svg>
  </div>

  <div class="controls">
    <button onclick="document.body.className='dark'">Dark Mode</button>
    <button onclick="document.body.className='light'">Light Mode</button>
  </div>

</body>
</html>
