<svg viewBox="0 0 320 180" width="320" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Mesh Blur scaled for 320x180 -->
    <filter id="mesh-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Plain dark background -->
  <rect x="0" y="0" width="320" height="180" fill="#0A0A0A" />

  <!-- Mesh Gradients -->
  <g>
    <circle cx="60" cy="35" r="140" fill="#EC4899" filter="url(#mesh-blur)" opacity="0.8" />
    <circle cx="265" cy="145" r="170" fill="#4F46E5" filter="url(#mesh-blur)" opacity="0.9" />
    <circle cx="90" cy="160" r="125" fill="#06B6D4" filter="url(#mesh-blur)" opacity="0.8" />
  </g>

  <!-- Typography Inside the Banner (Weight Contrast) -->
  <text x="100" y="85" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-style="italic" fill="#FFFFFF" text-anchor="start">
    <tspan x="100" dy="0" font-weight="300">arc</tspan>
    <tspan x="100" dy="32" font-weight="800">launcher</tspan>
  </text>
</svg>
