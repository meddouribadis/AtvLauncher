name: Release

# Tag push publishes GitHub Release APKs. workflow_dispatch also supports build-only and Play deploy/promote.
# Workflow artifacts expire after 1 day (handoff between jobs). Published files live on GitHub Releases.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for GitHub Release (e.g. 1.2.3). Leave empty to build only."
        required: false
        type: string
        default: ""
      deploy_play:
        description: Deploy Play Store AAB to internal track
        type: boolean
        default: false
      promote_play:
        description: Promote Play Store internal track to production
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  RELEASE_APK_FILENAME_PREFIX: arclauncher
  ARTIFACT_RETENTION_DAYS: 1

jobs:
  build-apk:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote_play && !inputs.deploy_play) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Setup signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -n "${SIGNING_JKS_FILE_BASE64:-}" || { echo "SIGNING_JKS_FILE_BASE64 is empty or unset"; exit 1; }
          test -n "${SIGNING_KEYSTORE_PASSWORD:-}" || { echo "SIGNING_KEYSTORE_PASSWORD is empty or unset"; exit 1; }
          test -n "${SIGNING_KEY_ALIAS:-}" || { echo "SIGNING_KEY_ALIAS is empty or unset"; exit 1; }
          test -n "${SIGNING_KEY_PASSWORD:-}" || { echo "SIGNING_KEY_PASSWORD is empty or unset"; exit 1; }
          echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
      - name: Set build metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -n "$TAG" ]; then
            echo "build_name=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # versionCode from pubspec.yaml (e.g. 1.0.6+4115 → 4115)
          BUILD_NUMBER=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          test -n "$BUILD_NUMBER" || { echo "Could not parse versionCode from pubspec.yaml"; exit 1; }
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build release APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github \
            --dart-define=ENABLE_SELF_UPDATER=true \
            --build-number=${{ steps.meta.outputs.build_number }} \
            --build-name=${{ steps.meta.outputs.build_name }}
          mkdir -p release-apks
          find build/app/outputs -name 'arc-launcher-universal-release.apk' -exec cp -t release-apks/ {} +
          find build/app/outputs -name 'arc-launcher-arm64-v8a-release.apk' -exec cp -t release-apks/ {} +
          find build/app/outputs -name 'arc-launcher-armeabi-v7a-release.apk' -exec cp -t release-apks/ {} +
          for apk in \
            release-apks/arc-launcher-universal-release.apk \
            release-apks/arc-launcher-arm64-v8a-release.apk \
            release-apks/arc-launcher-armeabi-v7a-release.apk; do
            test -f "$apk" || { echo "Missing $apk"; find build/app/outputs -name '*.apk'; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-apks/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  build-aab-play:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote_play && !inputs.deploy_play) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Setup signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -n "${SIGNING_JKS_FILE_BASE64:-}" || { echo "SIGNING_JKS_FILE_BASE64 is empty or unset"; exit 1; }
          test -n "${SIGNING_KEYSTORE_PASSWORD:-}" || { echo "SIGNING_KEYSTORE_PASSWORD is empty or unset"; exit 1; }
          test -n "${SIGNING_KEY_ALIAS:-}" || { echo "SIGNING_KEY_ALIAS is empty or unset"; exit 1; }
          test -n "${SIGNING_KEY_PASSWORD:-}" || { echo "SIGNING_KEY_PASSWORD is empty or unset"; exit 1; }
          echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
      - name: Set build metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -n "$TAG" ]; then
            echo "build_name=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # versionCode from pubspec.yaml (e.g. 1.0.6+4115 → 4115)
          BUILD_NUMBER=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml)
          test -n "$BUILD_NUMBER" || { echo "Could not parse versionCode from pubspec.yaml"; exit 1; }
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build play release AAB
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --flavor play \
            --build-number=${{ steps.meta.outputs.build_number }} \
            --build-name=${{ steps.meta.outputs.build_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  github-release:
    needs: [build-apk]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-apks
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release assets and notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          cp release-apks/arc-launcher-universal-release.apk \
            "dist/${RELEASE_APK_FILENAME_PREFIX}-${TAG}.apk"
          cp release-apks/arc-launcher-arm64-v8a-release.apk \
            "dist/${RELEASE_APK_FILENAME_PREFIX}-${TAG}-arm64-v8a.apk"
          cp release-apks/arc-launcher-armeabi-v7a-release.apk \
            "dist/${RELEASE_APK_FILENAME_PREFIX}-${TAG}-armeabi-v7a.apk"
          echo "Arc Launcher v${TAG}" > release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true

  deploy-play-store:
    needs: [build-aab-play]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_play
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: play-aab
          path: build/app/outputs/bundle/playRelease
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Setup Play credentials and Fastlane
        env:
          GOOGLE_PLAY_API_KEY: ${{ secrets.GOOGLE_PLAY_API_KEY }}
        run: |
          test -n "${GOOGLE_PLAY_API_KEY:-}" || { echo "GOOGLE_PLAY_API_KEY is empty or unset"; exit 1; }
          echo "$GOOGLE_PLAY_API_KEY" > fastlane/google_play_api_key.json
          gem install fastlane -NV
      - run: fastlane deploy
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

  # Promotes whatever is already on the internal track (no build needed).
  promote-play-store:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_play
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: Setup Play credentials and Fastlane
        env:
          GOOGLE_PLAY_API_KEY: ${{ secrets.GOOGLE_PLAY_API_KEY }}
        run: |
          test -n "${GOOGLE_PLAY_API_KEY:-}" || { echo "GOOGLE_PLAY_API_KEY is empty or unset"; exit 1; }
          echo "$GOOGLE_PLAY_API_KEY" > fastlane/google_play_api_key.json
          gem install fastlane -NV
      - run: fastlane promote
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
